<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WOL — Адмін-панель</title>
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <!-- ======================== LOGIN ======================== -->
    <section class="admin-login-view" id="loginView">
        <form class="admin-login-form" id="loginForm">
            <h1>Вхід в адмін-панель</h1>

            <label>
                Логін
                <input type="text" name="name" required>
            </label>

            <label>
                Пароль
                <input type="password" name="password" required>
            </label>

            <span class="admin-error" id="loginError"></span>

            <button type="submit">Увійти</button>
        </form>
    </section>

    <!-- ======================== DASHBOARD ======================== -->
    <section class="admin-dashboard-view is-hidden" id="dashboardView">

        <header class="admin-header">
            <h1>Wonder of Lavender — Адмін</h1>
            <button type="button" id="logoutButton">Вийти</button>
        </header>

        <nav class="admin-tabs">
            <button type="button" class="admin-tab is-active" data-tab="products">Товари</button>
            <button type="button" class="admin-tab" data-tab="orders">Замовлення</button>
        </nav>

        <!-- ---------------- PRODUCTS TAB ---------------- -->
        <section class="admin-tab-panel is-active" id="productsPanel">

            <details class="admin-create-box">
                <summary>+ Додати товар</summary>

                <form class="admin-form" id="createProductForm">

                    <label>Назва <input type="text" name="title" required></label>
                    <label>Опис <input type="text" name="description"></label>
                    <label>Ціна (грн) <input type="number" name="price" min="0" step="0.01" required></label>
                    <label>Категорія <input type="text" name="category" placeholder="напр. hydrolats" required></label>

                    <label>
                        Група каталогу
                        <select name="display_group">
                            <option value="products">products</option>
                            <option value="seedlings">seedlings</option>
                        </select>
                    </label>

                    <label>
                        Тип товару
                        <select name="product_type">
                            <option value="physical">physical</option>
                            <option value="ticket">ticket</option>
                        </select>
                    </label>

                    <label>
                        Режим ціни (лише для ticket)
                        <select name="pricing_mode">
                            <option value="">—</option>
                            <option value="person">person</option>
                            <option value="hour">hour</option>
                        </select>
                    </label>

                    <label>Залишок на складі <input type="number" name="stock" min="0"></label>
                    <label>Порядок сортування <input type="number" name="sort_order" value="0"></label>
                    <label>URL зображення <input type="text" name="image_url"></label>
                    <label>URL іконки <input type="text" name="icon_url"></label>

                    <label class="admin-checkbox">
                        <input type="checkbox" name="is_active" checked> Активний
                    </label>

                    <span class="admin-error" id="createProductError"></span>

                    <button type="submit">Створити товар</button>
                </form>
            </details>

            <div class="admin-toolbar">
                <button type="button" id="refreshProductsButton">Оновити список</button>
                <span class="admin-note">Показані лише активні товари (публічний GET /products).</span>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th><th>Назва</th><th>Категорія</th><th>Група</th>
                        <th>Ціна</th><th>Склад</th><th>Активний</th><th></th>
                    </tr>
                </thead>
                <tbody id="productsTableBody"></tbody>
            </table>
        </section>

        <!-- ---------------- ORDERS TAB ---------------- -->
        <section class="admin-tab-panel" id="ordersPanel">

            <div class="admin-toolbar">
                <button type="button" id="refreshOrdersButton">Оновити список</button>
            </div>

            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th><th>Код</th><th>Клієнт</th><th>Телефон</th>
                        <th>Сума</th><th>Статус</th><th>Оплата</th><th></th>
                    </tr>
                </thead>
                <tbody id="ordersTableBody"></tbody>
            </table>
        </section>

    </section>

    <script src="../WOL/JS/config.js"></script>
    <script src="../WOL/JS/api.js"></script>
    <script src="admin.js"></script>
</body>
</html>
